<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0E14"/>
      <stop offset="100%" stop-color="#161D2C"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#25F4EE"/>
      <stop offset="100%" stop-color="#00C4FF"/>
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FE2C55"/>
      <stop offset="100%" stop-color="#FF007A"/>
    </linearGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowPink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="8"/>

  <!-- Glowing background ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#cyanGrad)" stroke-width="2" opacity="0.3" filter="url(#glowCyan)"/>

  <!-- TikTok Note Shape - Cyan Layer (Offset Left) -->
  <path d="M330 140 C350 170 380 190 415 195 L415 245 C380 245 350 230 330 215 L330 340 C330 405 275 455 210 455 C145 455 95 405 95 340 C95 275 145 225 210 225 C220 225 230 226 240 230 L240 282 C230 278 220 275 210 275 C175 275 145 305 145 340 C145 375 175 405 210 405 C245 405 275 375 275 340 L275 95 L330 95 Z" fill="url(#cyanGrad)" opacity="0.9" transform="translate(-10, -5)" filter="url(#glowCyan)"/>

  <!-- TikTok Note Shape - Pink Layer (Offset Right) -->
  <path d="M330 140 C350 170 380 190 415 195 L415 245 C380 245 350 230 330 215 L330 340 C330 405 275 455 210 455 C145 455 95 405 95 340 C95 275 145 225 210 225 C220 225 230 226 240 230 L240 282 C230 278 220 275 210 275 C175 275 145 305 145 340 C145 375 175 405 210 405 C245 405 275 375 275 340 L275 95 L330 95 Z" fill="url(#pinkGrad)" opacity="0.9" transform="translate(10, 5)" filter="url(#glowPink)"/>

  <!-- TikTok Note Shape - White Core -->
  <path d="M330 140 C350 170 380 190 415 195 L415 245 C380 245 350 230 330 215 L330 340 C330 405 275 455 210 455 C145 455 95 405 95 340 C95 275 145 225 210 225 C220 225 230 226 240 230 L240 282 C230 278 220 275 210 275 C175 275 145 305 145 340 C145 375 175 405 210 405 C245 405 275 375 275 340 L275 95 L330 95 Z" fill="#FFFFFF"/>

  <!-- HD Download Badge in bottom right -->
  <g transform="translate(290, 310)">
    <rect width="170" height="75" rx="22" fill="url(#pinkGrad)" filter="url(#glowPink)"/>
    <text x="85" y="48" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">HD</text>
  </g>
</svg>
